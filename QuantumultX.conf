# Based on ddgksf2013 QuantumultX.conf (2026-10-11); simplified and customized.
# Requires a Quantumult X release supporting VLESS + Reality + Vision.
# Public profile: no nodes or credentials.
# Import, add your own node, select it in 默认代理, then refresh 完整业务分流.
# Keep rule matching optimization disabled. Back up local nodes before reimporting.
[general]
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
geo_location_checker = disabled
dns_exclusion_list = *.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
# Optional, leave off initially: udp_drop_list = 443, STUN, QUIC

[dns]
no-ipv6
no-system
server = 223.5.5.5
server = 119.29.29.29
server = /*.icloud.com/119.29.29.29
server = /*.icloud.com.cn/119.29.29.29
server = /*.tencent.com/119.29.29.29
server = /*.weixin.com/119.29.29.29

